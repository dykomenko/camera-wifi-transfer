name: Windows build

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.5.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable package
        shell: powershell
        run: .\scripts\build.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: Camera-WiFi-Transfer-Windows
          path: artifacts/*.zip

